# Borrador para el repo de la organización: Prosecretaria-Parlamentaria-HSN.github.io
# (ubicar en .github/workflows/actualizar-bloques.yml)
#
# Regenera las páginas por bloque a partir de los datos del sistema actual
# (bonifaciomariano/hsn-sistema-legislativo, repo público), que ya se actualiza
# solo dos veces por día. Esta corrida va unos 40 minutos después de cada una
# de esas, así las páginas de bloque siempre toman datos recién actualizados.
#
# Además, lee las actas de votación del Senado (data/votaciones.json, propio de
# este repo): es incremental y, si el sitio del Senado limita el acceso, corta
# sin insistir y completa en la corrida siguiente.
#
# No usa secretos ni tokens: el repo de datos es público (se lee con checkout)
# y el commit se hace con el GITHUB_TOKEN propio de este repo.
name: Actualizar páginas por bloque

on:
  schedule:
    # 09:40 ART (UTC-3) = 12:40 UTC -> después de la corrida de las 09:00 ART
    - cron: "40 12 * * *"
    # 22:40 ART (UTC-3) = 01:40 UTC del día siguiente -> después de la de las 22:00 ART
    - cron: "40 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-bloques
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de este repo
        uses: actions/checkout@v4

      - name: Checkout de los datos (repo del sistema legislativo)
        uses: actions/checkout@v4
        with:
          repository: bonifaciomariano/hsn-sistema-legislativo
          path: source

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del scraper de votaciones
        run: pip install requests beautifulsoup4

      # Si falla (sitio caído o limitando acceso) no frena la generación:
      # las páginas se arman con lo que ya está guardado.
      - name: Actualizar votaciones
        continue-on-error: true
        run: python scripts/scraper_votaciones.py

      - name: Generar páginas por bloque
        env:
          HSN_SOURCE: source
          HSN_OUT: .
        run: python scripts/generar_bloques.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 'source/' es el checkout de datos: no se publica ni se commitea.
          git add -A -- . ':!source'
          if git diff --cached --quiet; then
            echo "Sin cambios; nada que commitear."
            exit 0
          fi
          git commit -m "Actualización automática $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Los errores se publican como anotaciones para poder verlos sin abrir el log.
          if ! salida=$(git pull --rebase origin "${GITHUB_REF_NAME}" 2>&1 && git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1); then
            echo "::error::No se pudo guardar: $(echo "$salida" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
