name: Actualizar páginas por bloque

on:
  # Dos veces por día (hora de Argentina): 09:40 y 22:40. GitHub trabaja en UTC (ART = UTC-3).
  schedule:
    - cron: "40 12 * * *"
    - cron: "40 1 * * *"
  workflow_dispatch:
    inputs:
      reprocesar_sanciones:
        description: "Sanciones: boletines a volver a leer (ej. 8/26,9/26 o TODOS). Dejar vacío en el uso normal."
        type: string
        default: ""
      prueba_completa:
        description: "Correr también la prueba desde cero (agenda y OD; tarda unos 3 minutos más)"
        type: boolean
        default: false
      prueba_proyectos:
        description: "Prueba desde cero de PROYECTOS 2026 (tarda 1-2 horas)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-bloques
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de este repo
        uses: actions/checkout@v4

      # Solo para sembrar la PRIMERA vez lo que este repo todavía no tiene (fotos, sanciones iniciales) y
      # para el cruce de control del verificador. Las páginas NO leen estos datos. Si falla, no frena nada.
      - name: Checkout de control (repo del sistema legislativo)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: bonifaciomariano/hsn-sistema-legislativo
          path: source

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del scraper de votaciones
        run: pip install requests beautifulsoup4 pdfplumber openpyxl

      # Archivos fijos (fotos de senadores, tipografía): se copian una sola vez si faltan.
      - name: Sembrar archivos fijos (solo la primera vez)
        continue-on-error: true
        env:
          HSN_SOURCE: source
        run: python scripts/sembrar_fijos.py

      # Si falla (sitio caído o limitando acceso) no frena la generación:
      # las páginas se arman con lo que ya está guardado.
      - name: Actualizar votaciones
        continue-on-error: true
        run: python scripts/scraper_votaciones.py

      # Padrón de senadores propio (bloque, vigencia, provincia). Si el Senado no responde,
      # conserva el anterior y no frena la generación.
      - name: Actualizar padrón de senadores
        continue-on-error: true
        env:
          HSN_SOURCE: source
        run: python scripts/padron_senadores.py

      # Comisiones leídas directo del Senado. Si el Senado no responde, conserva lo anterior.
      - name: Actualizar comisiones
        continue-on-error: true
        env:
          HSN_SOURCE: source
        run: python scripts/comisiones_senado.py

      # Comisiones bicamerales (apartado aparte en cada página). 22 consultas con pausa.
      - name: Actualizar comisiones bicamerales
        continue-on-error: true
        run: python scripts/bicamerales_senado.py

      - name: Actualizar agenda y órdenes del día
        continue-on-error: true
        env:
          HSN_SOURCE: source
        run: python scripts/agenda_od_senado.py

      # Proyectos leídos directo del Senado (incremental; la primera vez parte de una base sembrada).
      - name: Actualizar proyectos
        continue-on-error: true
        env:
          HSN_SOURCE: source
        run: python scripts/proyectos_senado.py

      # Ayuda Memoria armada del Senado: las OD pendientes, con datos del PDF de cada una.
      # Los PDF van a /tmp (no se suben al repo) y se guardan en caché entre corridas.
      - name: Cache de PDF de OD
        uses: actions/cache@v4
        with:
          path: /tmp/pdfs_od
          key: pdfs-od-${{ github.run_id }}
          restore-keys: pdfs-od-

      - name: Actualizar Ayuda Memoria
        continue-on-error: true
        env:
          HSN_SOURCE: source
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/ayuda_memoria_senado.py

      # Sanciones: Boletín de Novedades de cada sesión (PDF del Senado). Incremental.
      - name: Actualizar sanciones (Boletín de Novedades)
        continue-on-error: true
        env:
          HSN_SOURCE: source
          SANCIONES_REPROCESAR: ${{ github.event.inputs.reprocesar_sanciones }}
        run: python scripts/sanciones_senado.py

      - name: Prueba desde cero (agenda y OD, solo del Senado)
        if: ${{ inputs.prueba_completa }}
        continue-on-error: true
        run: python scripts/prueba_desde_cero.py

      - name: Prueba desde cero (proyectos, solo del Senado)
        if: ${{ inputs.prueba_proyectos }}
        continue-on-error: true
        timeout-minutes: 300
        run: python scripts/prueba_proyectos_cero.py

      - name: Guardar copia de la prueba desde cero
        if: ${{ inputs.prueba_proyectos }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: proyectos-cero
          path: /tmp/salida_prueba/

      - name: Generar páginas por bloque
        env:
          HSN_OUT: .
          BASE_URL: https://prosecretaria-parlamentaria-hsn.github.io/
        run: python scripts/generar_bloques.py

      # Chequeos de cordura: si hay algo grave (bloque sin senadores, caída fuerte de proyectos,
      # aprobados listados como por caducar...) el job falla ACÁ y no se publica nada.
      - name: Verificar páginas generadas
        run: python scripts/verificar_paginas.py .

      - name: Commit y push si hay cambios
        run: |
          fallo() { echo "::error::$1: $(echo "$2" | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 'source/' es el checkout de datos: no se publica ni se commitea.
          r=$(git add -A 2>&1) || fallo "git add" "$r"
          git reset -q -- source 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios; nada que commitear."
            exit 0
          fi
          r=$(git commit -m "Actualización automática $(date -u '+%Y-%m-%d %H:%M UTC')" 2>&1) || fallo "git commit" "$r"
          r=$(git pull --rebase origin "${GITHUB_REF_NAME}" 2>&1) || fallo "git pull" "$r"
          r=$(git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1) || fallo "git push" "$r"
